name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Development sources of hal-kit and hal-hub (pyproject.toml, [tool.uv.sources]) are the
  # sibling directory ../Hal.next. Step H-50 replaces this clone with git tag sources.
  HAL_REPO: https://github.com/NotEoin/Hal.git
  HAL_REF: next

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.16.10 check .
      - run: uvx ruff@0.16.10 format --check .

  ascii:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ascii-check.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Clone the Hal worktree beside this repository
        run: git clone --depth 1 --branch "$HAL_REF" "$HAL_REPO" "$GITHUB_WORKSPACE/../Hal.next"
      - run: uv sync --all-packages --frozen
      - name: Run the hermetic tests with no network, no bus and an empty HOME
        run: |
          env -i PATH="$PWD/.venv/bin:/usr/bin:/bin" HOME="$(mktemp -d)" \
            http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
            python -m pytest

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --no-banner --log-opts=--all .'
