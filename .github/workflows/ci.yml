name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Development sources of hal-kit and hal-hub (pyproject.toml, [tool.uv.sources]) are the
  # sibling directory ../Hal, as pyproject.toml expects.
  HAL_REPO: https://github.com/NotEoin/Hal.git
  HAL_REF: main

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.16.10 check .
      - run: uvx ruff@0.16.10 format --check .

  ascii:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ascii-check.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Clone the Hal worktree beside this repository
        run: git clone --depth 1 --branch "$HAL_REF" "$HAL_REPO" "$GITHUB_WORKSPACE/../Hal"
      - run: uv sync --all-packages --frozen
      - name: Run the hermetic tests with no network, no bus and an empty HOME
        run: |
          env -i PATH="$PWD/.venv/bin:/usr/bin:/bin" HOME="$(mktemp -d)" \
            http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
            python -m pytest

  wsl:
    name: wsl2 (ubuntu 24.04)
    runs-on: windows-latest
    timeout-minutes: 30
    # Never run yet: it stays advisory until the first green run shows the suite passes under
    # WSL2, so an unproven runner cannot block a merge
    continue-on-error: true
    env:
      # WSL does not inherit the runner environment: WSLENV names what to pass in (/p converts a path)
      WSLENV: GITHUB_WORKSPACE/p:HAL_REF:HAL_REPO
    steps:
      - name: Keep line endings as LF
        # Scripts with a CRLF shebang line would not run in WSL
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: pipx python3-venv git

      - name: Copy the checkout into the WSL filesystem and clone Hal beside it
        # /mnt/d has no Unix permissions and is slow; pyproject.toml needs ../Hal
        shell: wsl-bash {0}
        run: |
          src="$(wslpath -u "$GITHUB_WORKSPACE" 2>/dev/null || printf %s "$GITHUB_WORKSPACE")"
          rm -rf "$HOME/hal-tools" "$HOME/Hal"
          cp -r "$src" "$HOME/hal-tools"
          git clone --depth 1 --branch "$HAL_REF" "$HAL_REPO" "$HOME/Hal"

      - name: Install uv
        shell: wsl-bash {0}
        run: |
          pipx install uv==0.8.0
          "$HOME/.local/bin/uv" --version

      - name: Test
        # Same hermetic run as the tests job: no network, no bus and an empty HOME
        shell: wsl-bash {0}
        run: |
          export PATH="$HOME/.local/bin:$PATH" UV_PYTHON_DOWNLOADS=never
          cd "$HOME/hal-tools"
          uv sync --all-packages --frozen
          env -i PATH="$PWD/.venv/bin:/usr/bin:/bin" HOME="$(mktemp -d)" \
            http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 \
            python -m pytest

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --no-banner --log-opts=--all .'
