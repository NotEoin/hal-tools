[module]
name = "web"
summary = "Web search, reading pages, weather, news, Wikipedia, definitions, unit and currency conversion, world time and maths"
python = "halweb.tools"

[[tools]]
name = "web_search"
function = "search"
description = "Search the web; returns titles, links and snippets. Use for current events, prices, opening hours and anything recent."
keywords = "google search look up internet online find out latest"
[tools.params.query]
required = true
[tools.params.limit]
type = "integer"

[[tools]]
name = "web_read"
function = "read_page"
description = "Read a web page's text, or a short summary of it."
keywords = "read page article website summarise link url"
timeout = 120
[tools.params.url]
required = true
[tools.params.summarise]
type = "boolean"

[[tools]]
name = "web_weather"
function = "weather"
description = "Current weather and the forecast for a place (home if none given): temperature, sky, rain chance, wind, sunrise and sunset."
keywords = "weather forecast rain temperature umbrella cold hot sunny tomorrow"
[tools.params.place]
[tools.params.days]
type = "integer"

[[tools]]
name = "web_news"
function = "news"
description = "Latest news headlines, optionally only about a topic."
keywords = "news headlines happening today current events"
[tools.params.topic]
[tools.params.limit]
type = "integer"

[[tools]]
name = "web_wikipedia"
function = "wikipedia"
description = "A short Wikipedia summary of a person, place, thing or idea."
keywords = "who is what is wikipedia encyclopedia explain about"
[tools.params.topic]
required = true

[[tools]]
name = "web_define"
function = "define"
description = "Dictionary definitions of an English word."
keywords = "define meaning word dictionary definition"
[tools.params.word]
required = true

[[tools]]
name = "web_convert"
function = "convert"
description = "Convert units (length, weight, volume, speed, data, time), temperatures (C, F, K) and currencies (three-letter codes such as GBP, EUR, USD)."
keywords = "convert how many units currency exchange rate pounds euros dollars miles km kg"
[tools.params.amount]
type = "number"
required = true
[tools.params.from_unit]
required = true
[tools.params.to_unit]
required = true

[[tools]]
name = "web_calculate"
function = "calculate"
description = "Work out arithmetic exactly: + - * / ** %, percentages ('15% of 80'), sqrt, log, sin and so on."
keywords = "calculate math maths sum multiply divide percent"
[tools.params.expression]
required = true

[[tools]]
name = "web_time"
function = "world_time"
description = "The time and date now in a city or time zone, or here."
keywords = "time clock what time timezone world"
[tools.params.place]
