[project]
name = "hal-life"
version = "0.1.0"
description = "Hal tools: contacts, habits and ledger"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["hal-kit>=0.1,<0.2", "hal-hub>=0.1,<0.2"]

[project.scripts]
hal-life = "hal_life:main"

[project.entry-points."hal.packs"]
contacts = "halcontacts"
habits = "halhabits"
ledger = "halledger"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hal_life",
            "src/halcontacts",
            "src/halhabits",
            "src/halledger"]
