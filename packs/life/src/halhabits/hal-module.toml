schema = 2

[module]
pack = "life"
name = "habits"
summary = "Habits with daily targets and streaks, mood and sleep logs, and an evening nudge"
python = "halhabits.tools"

[[tools]]
name = "habits_create"
function = "create"
description = "Start tracking a habit with a daily target, such as water 8 glasses, exercise 1, read 30 minutes, medication 1."
tier = "write"
reviewable = true
reversible = true
keywords = "track habit start goal daily"
[tools.params.name]
required = true
[tools.params.target]
type = "number"
minimum = 0
maximum = 1000000
[tools.params.unit]

[[tools]]
name = "habits_log"
function = "log"
description = "Record doing a habit: 'I drank a glass of water', 'I went for a run', 'took my tablets'."
tier = "write"
reviewable = true
reversible = true
keywords = "drank water exercised ran took medication read habit did log"
[tools.params.name]
required = true
[tools.params.amount]
type = "number"
minimum = 0
maximum = 1000000000
[tools.params.day]

[[tools]]
name = "habits_today"
function = "today"
description = "Progress on every habit today, with streaks."
tier = "read"
reviewable = true
reversible = true
keywords = "habits progress streak today"

[[tools]]
name = "habits_week"
function = "week"
description = "The last seven days: habits met, mood and sleep."
tier = "read"
reviewable = true
reversible = true
keywords = "habits week summary trend"

[[tools]]
name = "habits_mood"
function = "mood"
description = "Log mood from 1 (awful) to 5 (great), with an optional note."
tier = "write"
reviewable = true
reversible = true
keywords = "mood feeling feel happy sad tired stressed"
[tools.params.score]
type = "integer"
minimum = 1
maximum = 10
required = true
[tools.params.note]

[[tools]]
name = "habits_sleep"
function = "sleep"
description = "Log last night's sleep in hours, with quality 1 to 5."
tier = "write"
reviewable = true
reversible = true
keywords = "sleep slept hours bed night"
[tools.params.hours]
type = "number"
minimum = 0
maximum = 24
required = true
[tools.params.quality]
type = "integer"
minimum = 1
maximum = 5
[tools.params.note]

[[tools]]
name = "habits_remove"
function = "remove"
description = "Stop tracking a habit."
tier = "write"
reviewable = true
[tools.params.name]
required = true
