[project]
name = "hal-jobs"
version = "0.1.0"
description = "Hal tools: adapter to the hal-employment job-search app"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["hal-kit>=0.1,<0.2", "hal-hub>=0.1,<0.2"]

[project.scripts]
hal-jobs = "hal_jobs:main"

[project.entry-points."hal.packs"]
jobs = "haljobs"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hal_jobs",
            "src/haljobs"]
