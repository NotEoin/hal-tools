schema = 2

[module]
pack = "system"
name = "shell"
summary = "Runs shell commands: read-only ones directly, anything else only after approval"
python = "halshell.tools"

[[tools]]
name = "shell_look"
function = "look"
description = "Run one read-only program (ls, cat, grep, find, df, ps, systemctl status, journalctl and similar) and see its output. No pipes or redirects: use filter to keep matching lines and head to keep the first lines. Use when no other tool answers a question about this computer."
tier = "read"
untrusted_output = true
reversible = true
keywords = "command terminal shell bash run check look"
timeout = 30
[tools.params.command]
required = true
max_length = 1000
[tools.params.cwd]
format = "path"
access = "read"
[tools.params.filter]
max_length = 200
[tools.params.head]
type = "integer"
minimum = 0
maximum = 2000

[[tools]]
name = "shell_run"
function = "run"
description = "Run any shell command, including ones that change things. Last resort when no other tool can do it; the hub asks the user first."
tier = "system"
untrusted_output = true
runs_code = true
keywords = "execute command terminal script do"
timeout = 1800
[tools.params.command]
required = true
max_length = 4000
[tools.params.cwd]
[tools.params.timeout]
type = "integer"
minimum = 1
maximum = 600
