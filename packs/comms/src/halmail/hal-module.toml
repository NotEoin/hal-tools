schema = 2

[module]
pack = "comms"
name = "mail"
summary = "Email over IMAP: unread, search, read and summarise (read-only), drafts, and sending with confirmation"
python = "halmail.tools"

[[tools]]
name = "mail_unread"
function = "unread"
description = "Unread emails in the inbox, newest first: sender, subject and date. Reading does not mark them read."
tier = "read"
network = true
untrusted_output = true
reviewable = true
reversible = true
keywords = "email mail inbox unread new messages"
timeout = 60
[tools.params.account]
[tools.params.limit]
type = "integer"
minimum = 1
maximum = 200

[[tools]]
name = "mail_search"
function = "search"
description = "Find emails from the last N days by words in the sender, subject or text."
tier = "read"
network = true
untrusted_output = true
reviewable = true
reversible = true
keywords = "find email search mail from about"
timeout = 90
[tools.params.query]
required = true
[tools.params.account]
[tools.params.days]
type = "integer"
minimum = 0
maximum = 3650
[tools.params.limit]
type = "integer"
minimum = 1
maximum = 200

[[tools]]
name = "mail_read"
function = "read"
description = "Read one email in full, by its id from mail_unread or mail_search."
tier = "read"
network = true
untrusted_output = true
reversible = true
timeout = 60
[tools.params.message_id]
required = true
[tools.params.account]

[[tools]]
name = "mail_summarise"
function = "summarise"
description = "A short summary of the unread mail: who wrote and what needs a reply."
tier = "read"
network = true
untrusted_output = true
reviewable = true
reversible = true
keywords = "summarise inbox email summary anything important"
timeout = 180
[tools.params.account]
[tools.params.limit]
type = "integer"
minimum = 1
maximum = 200

[[tools]]
name = "mail_draft"
function = "draft"
description = "Write an email or reply and save it in Drafts for the user to check and send."
tier = "write"
network = true
reviewable = true
reversible = true
keywords = "draft reply write email compose"
timeout = 60
[tools.params.to]
format = "email"
required = true
[tools.params.subject]
required = true
[tools.params.body]
content = true
required = true
[tools.params.account]
[tools.params.reply_to]
description = "Message-ID being replied to"

[[tools]]
name = "mail_send"
function = "send"
description = "Send an email now."
tier = "send"
network = true
keywords = "send email"
timeout = 60
[tools.params.to]
format = "email"
required = true
[tools.params.subject]
required = true
[tools.params.body]
content = true
required = true
[tools.params.account]
[tools.params.reply_to]

[[tools]]
name = "mail_accounts"
function = "accounts"
description = "The email accounts Hal can read."
tier = "read"
reviewable = true
reversible = true
