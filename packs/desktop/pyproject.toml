[project]
name = "hal-desktop"
version = "0.1.0"
description = "Hal tools: desktop session, screen, media and RGB lighting"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["hal-kit>=0.1,<0.2", "hal-hub>=0.1,<0.2"]

[project.scripts]
hal-desktop = "hal_desktop:main"

[project.entry-points."hal.packs"]
desktop = "haldesk"
screen = "halscreen"
media = "halmedia"
rgb = "halrgb"

[tool.hal-pack]
# PyGObject has no wheels and needs system headers to build, so the env is made with the system
# python and its site packages (which hold `gi`), plus this pack and its dependencies
env = "system"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hal_desktop",
            "src/haldesk",
            "src/halscreen",
            "src/halmedia",
            "src/halrgb"]
