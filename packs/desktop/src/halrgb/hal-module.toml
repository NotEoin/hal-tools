[module]
name = "rgb"
summary = "RGB lighting through OpenRGB: colours, brightness, effects, profiles, and lights that show Hal's state"
python = "halrgb.tools"

[[tools]]
name = "rgb_colour"
function = "colour"
description = "Set the RGB lights (RAM, graphics card, motherboard, or all) to a colour such as red, warm white or #ff8800, at a brightness."
keywords = "lights light lighting colour color rgb leds glow set make"
[tools.params.colour]
required = true
[tools.params.device]
description = "part of a device name such as ram, gpu or motherboard; all by default"
[tools.params.brightness]
type = "integer"
description = "0 to 100"

[[tools]]
name = "rgb_off"
function = "off"
description = "Turn the RGB lights off."
keywords = "lights off dark rgb"
[tools.params.device]

[[tools]]
name = "rgb_effect"
function = "effect"
description = "Switch the lights to a built-in effect such as rainbow, breathing or spectrum cycle."
keywords = "rainbow breathing effect animation pattern lights"
[tools.params.effect]
required = true
[tools.params.device]

[[tools]]
name = "rgb_profiles"
function = "profiles"
description = "List the lighting profiles saved in OpenRGB."

[[tools]]
name = "rgb_profile"
function = "profile"
description = "Load a lighting profile saved in OpenRGB."
keywords = "lighting profile scene preset"
[tools.params.name]
required = true

[[tools]]
name = "rgb_devices"
function = "devices"
description = "List the RGB devices with their LEDs and effects."

[[tools]]
name = "rgb_state"
function = "state"
description = "Show one of Hal's states on the lights: idle, listening, thinking, speaking or alert."
[tools.params.state]
required = true
enum = ["idle", "listening", "thinking", "speaking", "alert"]
