[module]
name = "files"
summary = "Find files, recent files, read and summarise documents, largest folders, duplicates, tidy Downloads"
python = "halfiles.tools"

[[tools]]
name = "files_find"
function = "find"
description = "Find files by words in the name, kind (documents, spreadsheets, presentations, images, videos, audio, archives, code, installers), minimum size and how recently changed."
keywords = "find file where is search locate document pdf"
timeout = 120
[tools.params.name]
[tools.params.kind]
[tools.params.larger_than]
description = "for example 100mb"
[tools.params.modified_days]
type = "integer"
[tools.params.root]
description = "folder to search; the usual folders by default"
[tools.params.limit]
type = "integer"

[[tools]]
name = "files_recent"
function = "recent"
description = "Files changed most recently, optionally in one folder such as ~/Downloads."
keywords = "recent latest downloaded last file"
timeout = 120
[tools.params.limit]
type = "integer"
[tools.params.folder]

[[tools]]
name = "files_read"
function = "read"
description = "Read a document's text (text, Markdown, code, PDF, Word, OpenDocument, PowerPoint), or summarise it."
keywords = "read open summarise document pdf contents what does it say"
timeout = 180
[tools.params.path]
required = true
[tools.params.summarise]
type = "boolean"
[tools.params.limit]
type = "integer"

[[tools]]
name = "files_largest"
function = "largest"
description = "The biggest folders and files under a folder, to find what is filling the disk."
keywords = "space disk full big large biggest"
timeout = 600
[tools.params.folder]
[tools.params.limit]
type = "integer"

[[tools]]
name = "files_duplicates"
function = "duplicates"
description = "Find identical duplicate files in a folder."
keywords = "duplicate copies same file"
timeout = 600
[tools.params.folder]
[tools.params.min_size]
[tools.params.limit]
type = "integer"

[[tools]]
name = "files_tidy_downloads"
function = "tidy_downloads"
description = "Tidy the Downloads folder by moving loose files into folders by type."
confirm = true
keywords = "tidy organise clean downloads"
[tools.params.folder]
[tools.params.older_than_days]
type = "integer"

[[tools]]
name = "files_folder_size"
function = "folder_size"
description = "The total size of a folder."
timeout = 600
[tools.params.folder]
required = true
