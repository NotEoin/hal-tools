[module]
name = "calendar"
summary = "Events, reminders with push notifications, agenda, free time and CalDAV (iCloud) sync"
python = "halcal.tools"

[[tools]]
name = "calendar_add"
function = "add"
description = "Add an event to the calendar. Times in plain English: 'thursday at 10', 'tomorrow 3pm for an hour', 'every monday at 9'. Reminders are pushed to the phone and spoken. Reports any clash."
keywords = "appointment meeting schedule book remind event diary"
[tools.params.title]
description = "what the event is"
required = true
[tools.params.when_text]
description = "when, in plain words"
[tools.params.duration_minutes]
type = "integer"
[tools.params.location]
[tools.params.notes]
[tools.params.reminders]
type = "array"
description = "minutes before to remind, for example 10,60"
[tools.params.repeat]
description = "for example 'every weekday' or 'monthly'"

[[tools]]
name = "calendar_agenda"
function = "agenda"
description = "List events for today, tomorrow, this week, next week, the next N days or a given day."
keywords = "today schedule what's on diary busy plans"
[tools.params.span]
description = "today, tomorrow, week, next week, next 3 days, friday, 14 october"

[[tools]]
name = "calendar_find"
function = "find"
description = "Find events by words in their title, notes or location."
keywords = "when is search"
[tools.params.query]
required = true
[tools.params.days]
type = "integer"

[[tools]]
name = "calendar_delete"
function = "delete"
description = "Delete an event, found by its id or by words in its title."
confirm = true
keywords = "cancel remove"
[tools.params.event]
required = true

[[tools]]
name = "calendar_move"
function = "move"
description = "Move an event to a new date or time."
keywords = "reschedule postpone change time"
[tools.params.event]
required = true
[tools.params.when_text]
required = true

[[tools]]
name = "calendar_free"
function = "free"
description = "Find free slots of a given length within working hours."
keywords = "available free time when am i free slot"
[tools.params.duration_minutes]
type = "integer"
[tools.params.span]
[tools.params.day_start]
type = "integer"
[tools.params.day_end]
type = "integer"

[[tools]]
name = "calendar_import"
function = "import_ics"
description = "Import events from an .ics file."
[tools.params.path]
required = true

[[tools]]
name = "calendar_export"
function = "export_ics"
description = "Export every event to an .ics file."
[tools.params.path]

[[tools]]
name = "calendar_sync"
function = "sync"
description = "Sync with the CalDAV account (such as Apple iCloud Calendar) now."
keywords = "icloud apple sync"
timeout = 120

[[tools]]
name = "calendar_calendars"
function = "calendars"
description = "List the calendars on the CalDAV account."
timeout = 60

[[tools]]
name = "calendar_setup_caldav"
function = "setup_caldav"
description = "Connect a CalDAV account. For Apple iCloud: the Apple ID email and an app-specific password made at appleid.apple.com."
keywords = "icloud apple connect account"
timeout = 60
[tools.params.username]
required = true
[tools.params.password]
required = true
[tools.params.url]
[tools.params.push_to]
description = "calendar name new events go to"
