[module]
name = "briefing"
summary = "Morning and evening briefings: weather, calendar, tasks, job search, headlines and computer health"
python = "halbrief.tools"
calls = ["web_weather", "calendar_agenda", "tasks_list", "web_news", "system_overview", "system_services", "jobs_digest"]

[[tools]]
name = "briefing_build"
function = "build"
description = "Put together a morning or evening briefing (weather, calendar, tasks, job search, headlines), or a job-search update (kind jobs), and return it to read out."
keywords = "briefing morning summary my day today overview what's happening update"
timeout = 300
[tools.params.kind]
enum = ["morning", "evening", "jobs"]

[[tools]]
name = "briefing_deliver"
function = "brief"
description = "Deliver a briefing now: spoken aloud, pushed to the phone and saved in the daily note."
timeout = 300
[tools.params.kind]
enum = ["morning", "evening", "jobs"]
[tools.params.speak]
type = "boolean"
[tools.params.push]
type = "boolean"
[tools.params.save]
type = "boolean"
