schema = 2

[module]
pack = "organiser"
name = "routines"
summary = "Scenes (focus, relax, goodnight, away, movie), scheduled actions and event triggers"
python = "halroutines.tools"
calls = ["briefing_deliver", "clock_pomodoro", "desktop_banners", "desktop_lock", "desktop_night_light", "media_control", "notify_dnd", "rgb_colour", "rgb_effect", "rgb_off"]

[[tools]]
name = "routines_run"
function = "run_scene"
description = "Run a scene: focus, relax, goodnight, away, movie, or one saved earlier. Each sets several things at once (notifications, lights, music, lock)."
tier = "write"
keywords = "scene mode focus relax goodnight bedtime away movie routine"
timeout = 600
[tools.params.name]
required = true

[[tools]]
name = "routines_scenes"
function = "scenes"
description = "List the scenes and what each one does."
tier = "read"
reviewable = true
reversible = true

[[tools]]
name = "routines_save_scene"
# Steps later run unattended, so saving asks and approval creates the routine grant (REQ-PACK-26).
function = "save_scene"
description = "Create or change a scene from a list of tool calls, each {tool, args}."
tier = "act"
keywords = "make a scene create routine"
routine = { id = "name", steps = "steps" }
[tools.params.name]
required = true
[tools.params.steps]
format = "json"
required = true
description = "list of {\"tool\": name, \"args\": {...}}"

[[tools]]
name = "routines_delete_scene"
function = "delete_scene"
description = "Delete a saved scene."
tier = "write"
reviewable = true
[tools.params.name]
required = true

[[tools]]
name = "routines_schedule"
# Steps later run unattended, so saving asks and approval creates the routine grant (REQ-PACK-26).
function = "schedule"
description = "Run tool calls at a time, once or repeating: 'every weekday at 8:45', 'at 23:00'. To run a scene use the step {\"tool\": \"routines_run\", \"args\": {\"name\": scene}}."
tier = "act"
keywords = "schedule every day automatically at time automate"
routine = { id = "label", steps = "steps" }
[tools.params.steps]
format = "json"
required = true
description = "one {\"tool\": name, \"args\": {...}} or a list of them"
[tools.params.when_text]
required = true
[tools.params.label]
required = true
description = "a short name for the schedule"

[[tools]]
name = "routines_schedules"
function = "schedules"
description = "List scheduled routines and when they next run."
tier = "read"
reviewable = true
reversible = true

[[tools]]
name = "routines_unschedule"
function = "unschedule"
description = "Remove a schedule by id or name."
tier = "write"
reviewable = true
reversible = true
[tools.params.which]
required = true

[[tools]]
name = "routines_add_trigger"
# Steps later run unattended, so saving asks and approval creates the routine grant (REQ-PACK-26).
function = "add_trigger"
description = "Run tool calls when something happens: idle, usb_added, offline, online, disk_full or login. To run a scene use the step {\"tool\": \"routines_run\", \"args\": {\"name\": scene}}."
tier = "act"
keywords = "when trigger if automatically event"
routine = { id = "label", steps = "steps" }
[tools.params.event]
required = true
enum = ["idle", "usb_added", "offline", "online", "disk_full", "login"]
[tools.params.steps]
format = "json"
required = true
description = "one {\"tool\": name, \"args\": {...}} or a list of them"
[tools.params.label]
required = true
description = "a short name for the trigger"

[[tools]]
name = "routines_triggers"
function = "triggers"
description = "List the triggers."
tier = "read"
reviewable = true
reversible = true

[[tools]]
name = "routines_remove_trigger"
function = "remove_trigger"
description = "Remove a trigger by id."
tier = "write"
reviewable = true
reversible = true
[tools.params.trigger_id]
type = "integer"
minimum = 1
maximum = 1000000
required = true

[[units]]
file = "systemd/hal-routines.service"
